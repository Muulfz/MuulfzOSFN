<?xml version="1.0" encoding="utf-8"?>
<!--
  MuulfzOS Fortnite playbook manifest. Win11 24H2 / 25H2 / 26H2.
  26H2 = build 26300 (enablement KB5121794, GA 2026-09-29). 28000 (26H1) is
  Arm new-device only, deliberately not listed.

  DisableHardwareRequirements is FALSE on purpose: since 2026-02-19 every
  Fortnite PC tournament needs Secure Boot + TPM 2.0 + IOMMU. Bypassing the
  TPM check at install would hide a machine that can't queue tournaments.

  CheckboxOption IsChecked defaults to true in AME. Max 4 options per page
  without TopLine/BottomLine. Option names are matched by action "option:".
-->
<Playbook>
  <Name>MuulfzOSFN</Name>
  <Username>Muulfz</Username>
  <Title>MuulfzOS Fortnite - Competitive 26H2</Title>
  <ShortDescription>Win11 24H2 / 25H2 / 26H2 tuned for competitive Fortnite, anti-cheat-safe</ShortDescription>
  <Description>Competitive Fortnite profile for Windows 11 24H2, 25H2 and 26H2. Removes Copilot, Recall, Click to Do and consumer bloat, applies only measured or zero-risk latency tweaks, and keeps everything Easy Anti-Cheat and BattlEye check: Secure Boot, TPM, IOMMU, Defender, driver signing and default exploit mitigations. Placebo tweaks (Nagle/TCP, bcdedit timers, forced MSI mode) are left out on purpose.</Description>
  <Version>0.9.1</Version>
  <UniqueId>f047ebd9-81ec-4cf6-aace-422d0e02ced5</UniqueId>
  <SupportedBuilds>
    <string>26100</string>
    <string>26200</string>
    <string>26300</string>
  </SupportedBuilds>
  <!-- No LocalAccounts: in AME's enum LocalAccounts == PasswordSet (both 11), which makes
       AME force a password on the current user (live) and bake fixed credentials into
       injected ISOs. Community ISOs must let each user create their own account. -->
  <Requirements>
    <Requirement>NoPendingUpdates</Requirement>
  </Requirements>
  <SupportsISO>true</SupportsISO>
  <ISO>
    <DisableBitLocker>true</DisableBitLocker>
    <DisableHardwareRequirements>false</DisableHardwareRequirements>
  </ISO>
  <OOBE>
    <BulletPoints>
      <BulletPoint Icon="Rocket" Title="Fortnite first" Description="High priority for the game process, Ultimate Performance plan, HAGS on, VBS off by default."/>
      <BulletPoint Icon="Lock" Title="Tournament-safe" Description="Secure Boot, TPM, IOMMU, Defender and driver signing untouched. Setup notes on the desktop flag BIOS fixes and in-game settings."/>
      <BulletPoint Icon="Privacy" Title="26H2 debloat" Description="Copilot, Recall, Click to Do, Settings agent, Paint AI, Widgets, Bing and OneDrive removed."/>
    </BulletPoints>
  </OOBE>
  <FeaturePages>
    <CheckboxPage IsRequired="true" Description="Fortnite tuning. Untick VBS off if you also play Valorant or FACEIT (they require Memory Integrity).">
      <Options>
        <CheckboxOption>
          <Text>Disable VBS / Memory Integrity (about 5-8% FPS)</Text>
          <Name>vbs-off</Name>
        </CheckboxOption>
        <CheckboxOption>
          <Text>Start Fortnite at High CPU priority</Text>
          <Name>fortnite-high-priority</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Dual-CCD Ryzen X3D (7900/7950/9900/9950X3D): keep Balanced plan</Text>
          <Name>x3d-balanced</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Block driver updates from Windows Update</Text>
          <Name>wu-no-drivers</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <!-- Unticked until the VM A/B (tests/vm/bench-compare.ps1) shows they don't cost anything. -->
    <CheckboxPage IsRequired="true" Description="Performance. Service grouping keeps audio, network, firewall and Xbox in their own processes.">
      <Options>
        <CheckboxOption IsChecked="false">
          <Text>Group services into fewer processes</Text>
          <Name>svchost-group</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Memory compression off (16 GB+ RAM)</Text>
          <Name>memcomp-off</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Fault Tolerant Heap off</Text>
          <Name>fth-off</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <CheckboxPage IsRequired="true" Description="Software and look. Fortnite itself installs from the Epic launcher after you sign in.">
      <Options>
        <CheckboxOption>
          <Text>Install Epic Games Launcher (official installer, needs internet)</Text>
          <Name>install-epic</Name>
        </CheckboxOption>
        <CheckboxOption>
          <Text>MuulfzOS wallpaper and lock screen</Text>
          <Name>muulfz-wallpaper</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
  </FeaturePages>
</Playbook>
